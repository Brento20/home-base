# Checks every push and pull request: types, formatting and lint, unit tests, then the
# end-to-end journeys at phone size against sample data (no secrets needed).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run check

      - name: Formatting and lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end journeys (dev server)
        run: npm run test:e2e

      - name: End-to-end journeys (the built Cloudflare Worker)
        run: npm run test:e2e
        env:
          E2E_WORKER: '1'

      - name: Keep the trace of a failed journey
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
