<!doctype html>
<html lang="en-AU" data-daypart="evening">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Plans, chores, lists, money and notes for the people you live with."
		/>
		<meta name="format-detection" content="telephone=no" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0b0807" />
		<meta name="color-scheme" content="dark" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="home base" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/favicon-32.png"
			type="image/png"
			sizes="32x32"
		/>
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/favicon-16.png"
			type="image/png"
			sizes="16x16"
		/>
		<!-- 180×180, square and opaque: iOS rounds the corners itself. -->
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/icons/apple-touch-icon.png"
			sizes="180x180"
		/>
		<!-- iPhone launch screens: the backdrop with the house, one per screen size. -->
		<link
			rel="apple-touch-startup-image"
			href="%sveltekit.assets%/splash/splash-1320x2868.png"
			media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="%sveltekit.assets%/splash/splash-1206x2622.png"
			media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="%sveltekit.assets%/splash/splash-1290x2796.png"
			media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="%sveltekit.assets%/splash/splash-1179x2556.png"
			media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="%sveltekit.assets%/splash/splash-1284x2778.png"
			media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="%sveltekit.assets%/splash/splash-1170x2532.png"
			media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="%sveltekit.assets%/splash/splash-1125x2436.png"
			media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="%sveltekit.assets%/splash/splash-1242x2688.png"
			media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="%sveltekit.assets%/splash/splash-828x1792.png"
			media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<link
			rel="apple-touch-startup-image"
			href="%sveltekit.assets%/splash/splash-750x1334.png"
			media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
		/>
		<script>
			// Pick the palette before first paint so there's no flash. Kept in step with #lib/ui/daypart.ts.
			(function () {
				var preview = new URLSearchParams(location.search).get('daypart');
				var hour = Number(
					new Intl.DateTimeFormat('en-AU', {
						hour: 'numeric',
						hourCycle: 'h23',
						timeZone: 'Australia/Sydney'
					}).format(new Date())
				);
				var part = hour >= 5 && hour < 11 ? 'morning' : hour >= 11 && hour < 17 ? 'day' : 'evening';
				if (preview === 'morning' || preview === 'day' || preview === 'evening') part = preview;
				document.documentElement.dataset.daypart = part;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- iPhones ignore the manifest's portrait lock, so a phone on its side gets this instead. -->
		<div class="turn-upright">
			<svg class="turn-upright-phone" width="34" height="34" viewBox="0 0 24 24" fill="none"
				stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
				<rect x="6.5" y="2.5" width="11" height="19" rx="2.5" />
				<path d="M10.5 18.5h3" />
			</svg>
			<p class="turn-upright-title">Turn me upright</p>
			<p class="turn-upright-note">home base is made for holding in one hand.</p>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
